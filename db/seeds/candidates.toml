# Liste éditoriale des candidat·es à l'élection présidentielle de 2027.
#
# Chaque entrée est un choix éditorial : elle doit porter une source publique et vérifiable.
# `source_date` : la date de l'acte (déclaration, désignation), pas celle de l'article qui le
# rapporte. C'est l'acte que la fiche affiche ; l'article n'en est que la preuve. Quand les deux
# diffèrent, le dire dans `note`. Une candidature annoncée par un tiers ne suffit pas ; on cite la
# déclaration, pas le commentaire qu'on en fait.
#
# Identification : `an_uid` pour toute personne passée par l'Assemblée depuis la XIe législature —
# c'est le cas le plus fiable, la personne existe déjà en base. `wikidata_qid` sinon : le job crée
# alors la personne, avec ce seul identifiant.
#
# statut : declare | pressenti | retire
#
# Liste éditoriale, pas un travail d'implémentation (voir docs/plans/phase-2-api-ui.md) : chaque
# ajout doit porter une source vérifiée en ouvrant réellement l'article cité, jamais recopiée de
# mémoire. Les deux premières entrées ont été choisies aussi pour exercer les deux chemins
# d'identification — dont le cas qui casse, une personne jamais élue à l'Assemblée.

