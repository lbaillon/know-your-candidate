# Ancrage gauche-droite — voir docs/plans/phase-3-categorisation.md, section « Le seed d'ancrage »,
# et docs/data-sources.md § 4.
#
# Source vérifiée (lot A, F2 résolu — voir phase-3.0-feedback.md) : « Instruction relative à
# l'attribution des nuances aux candidats aux élections législatives de 2024 », ministère de
# l'Intérieur et des Outre-mer, NOR IOMA2415630C, signée par Gérald Darmanin le 11 juin 2024,
# https://www.legifrance.gouv.fr/circulaire/id/45565 — Annexe 1, grille de 24 nuances individuelles.
# Ce n'est pas la grille « 2026, 26 nuances » évoquée par une version antérieure de
# data-sources.md § 4 (corrigé dans le même commit que ce fichier) : c'est la grille législative en
# vigueur au moment de l'élection de la 17e législature, la plus proche de ce que nous ancrons — des
# groupes parlementaires, pas des candidats à une élection locale.
#
# Les 24 codes, dans l'ordre où l'annexe les publie (elle-même ordonnée gauche → droite) :
#   EXG, COM, FI, SOC, RDG, VEC, DVG, UG, ECO, REG, DIV,
#   REN, MDM, HOR, ENS, DVC, UDI, LR, DVD, DSV,
#   RN, REC, UXD, EXD
#
# Répartition en six blocs : reprend cet ordre officiel tel quel, REG/DIV (régionalistes et
# inclassables) écartés de l'axe gauche-droite plutôt que rattachés arbitrairement à un camp :
#   extreme_gauche = EXG
#   gauche         = COM, FI, SOC, RDG, VEC, DVG, UG, ECO
#   divers         = REG, DIV
#   centre         = REN, MDM, HOR, ENS, DVC, UDI
#   droite         = LR, DVD, DSV
#   extreme_droite = RN, REC, UXD, EXD
#
# La grille nuance des **candidats**, jamais des groupes parlementaires (docs/data-sources.md § 4,
# réserve 3) : le rattachement nuance → parti → groupe ci-dessous est notre travail éditorial, pas une
# donnée publiée telle quelle. Chaque entrée sans nuance propre dans la grille, ou dont le
# rattachement n'est pas immédiat (renommage de groupe, alliance électorale, groupe composite), porte
# un `note` qui l'explique — c'est ce que docs/data-sources.md appelle « citer sans s'y soumettre ».
#
# Vérifié en base (`organe` table) :
#   SELECT an_uid, libelle, legislature FROM organe
#   WHERE code_type = 'GP' AND legislature IN (15, 16, 17) AND is_non_inscrit = false
#   ORDER BY legislature, libelle, an_uid;
# 40 lignes (voir la note historique de F2 : le plan en comptait 39, une nouvelle mesure en a trouvé
# 40 — écart pris en compte ici, pas une erreur de cette liste).

version = "grille-legislatives-2024-v1"
description = "Ancrage dérivé de la grille des nuances individuelles - élections législatives 2024 (Instruction NOR IOMA2415630C, ministère de l'Intérieur et des Outre-mer, 11 juin 2024)."
grille_version = "legislatives-2024"
grille_date = 2024-06-11
source_url = "https://www.legifrance.gouv.fr/circulaire/id/45565"

# Coordonnées des blocs. L'annexe 1 de la grille (voir en tête de fichier) est une liste plate de
# 24 nuances, sans colonne de regroupement : elle n'organise pas elle-même six blocs, contrairement
# à ce qu'une version antérieure de ce commentaire supposait avant vérification de la source
# primaire (phase-3.0-feedback.md). Le regroupement en six blocs ET leurs coordonnées sont donc
# TOUS DEUX de notre fait — la liste plate n'en donne que l'ordre gauche-droite implicite, que ce
# regroupement respecte. Ils sont ici pour être contestés — une PR d'une ligne suffit.
[bloc]
extreme_gauche = -1.0
gauche         = -0.6
centre         = -0.1
divers         =  0.0
droite         =  0.6
extreme_droite =  1.0

