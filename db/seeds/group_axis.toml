# TODO (bloquant) — grille de nuances non vérifiée, `label_scrutins_heuristic` refuse de charger
# ce fichier tant que ce bandeau n'a pas été retiré.
#
# Cette session d'implémentation n'a pas pu confirmer, avec une source primaire citable et datée,
# le rattachement nuance → groupe parlementaire ni les six coordonnées de bloc pour la grille des
# nuances politiques telle que documentée par docs/data-sources.md § 4 (« version 2026, 26 nuances,
# 6 blocs »). Une recherche a permis de retrouver une grille officielle voisine — celle des
# élections législatives de 2024 (24 nuances), Instruction du ministère de l'Intérieur relative à
# l'attribution des nuances aux candidats aux élections législatives de 2024, Légifrance
# https://www.legifrance.gouv.fr/circulaire/id/45565 — mais ni sa version ni ses 24 codes
# (EXG, COM, FI, SOC, RDG, VEC, DVG, UG, ECO, REG, DIV, REN, MDM, HOR, ENS, DVC, UDI, LR, DVD, DSV,
# RN, REC, UXD, EXD) ne correspondent nécessairement à la grille 2026 à 26 nuances citée par
# data-sources.md, et le rattachement groupe parlementaire → nuance (qui n'est publié par le
# ministère qu'au niveau des candidats, jamais des groupes) reste un travail à faire, pas à
# deviner. CLAUDE.md et docs/plans/phase-3-categorisation.md sont explicites sur ce point : un
# fichier de source à moitié inventé est pire qu'un fichier incomplet.
#
# Ce qui EST vérifié, parce que ça se lit directement en base (`organe` table, requête ci-dessous) :
# les 40 groupes parlementaires (hors non-inscrits) des législatures 15 à 17, leur `an_uid` et leur
# libellé exact. Le plan comptait 39 (42 organes GP moins 3 non-inscrits, mesuré le 18/08/2026) ;
# une nouvelle mesure du 18/08/2026 en trouve 40 (43 moins 3) — écart d'une unité à noter au
# prochain point du plan, pas une erreur de cette liste.
#
#   SELECT an_uid, libelle, legislature FROM organe
#   WHERE code_type = 'GP' AND legislature IN (15, 16, 17) AND is_non_inscrit = false
#   ORDER BY legislature, libelle, an_uid;
#
# Reste à faire avant que ce seed soit chargeable :
#   1. retrouver/confirmer la grille des nuances politiques 2026 (26 nuances, 6 blocs) citée par
#      data-sources.md § 4 — version exacte, date de publication, URL de la publication officielle ;
#   2. renseigner `grille_version`, `grille_date`, `source_url` ci-dessous ;
#   3. pour chacun des 40 groupes, renseigner `nuance` (le code officiel) et `bloc` (un des six blocs
#      définis dans `[bloc]` ci-dessous) ; un `note` est obligatoire quand le rattachement n'est pas
#      évident (ex. les groupes dupliqués ci-dessous, ou un groupe centriste à cheval sur deux
#      nuances) ;
#   4. retirer ce bandeau `TODO` une fois les trois points ci-dessus faits — c'est ce retrait, pas
#      une date, que `label_scrutins_heuristic` vérifie.

version = ""
description = "Ancrage dérivé de la grille des nuances politiques du ministère de l'Intérieur."
grille_version = ""
# grille_date = 2026-01-01
source_url = ""

# Coordonnées des blocs. Ce sont les SEULS nombres que nous inventons : la grille ordonne six
# blocs, elle ne les chiffre pas. Ils sont ici pour être contestés — une PR d'une ligne suffit.
# Valeurs de départ reprises de docs/plans/phase-3-categorisation.md ; à revoir en même temps que
# le reste de ce fichier, pas avant.
[bloc]
extreme_gauche = -1.0
gauche         = -0.6
centre         = -0.1
divers         =  0.0
droite         =  0.6
extreme_droite =  1.0

