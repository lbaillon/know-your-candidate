# Thèmes et axes. Chaque thème a un axe à deux pôles nommés symétriquement (methodology.md § 4).
#
# Convention de signe, à ne pas inverser : le pôle négatif est celui situé du côté gauche de
# l'ancrage des nuances (db/seeds/group_axis.toml). Ce n'est pas un jugement de valeur, c'est ce
# qui rend comparables le signe d'une catégorisation humaine et celui d'une estimation automatique.
#
# ATTENTION à qui recopierait methodology.md § 4 sans relire : ce tableau liste « Pôle A » puis
# « Pôle B » sans imposer un ordre gauche→droite constant. Pour cinq thèmes sur six, A est bien le
# pôle de gauche. Sur `securite`, A (« extension des pouvoirs de police et fermeté pénale ») est le
# pôle de droite et B (« libertés publiques, prévention, garanties procédurales ») celui de gauche —
# l'ordre y est donc inversé ci-dessous, volontairement.
#
# `autre` n'a pas de pôle : il sert à dire « relu, ne relève d'aucun thème », ce qui n'est pas la
# même chose que « pas encore regardé ».
#
# ---
#
# Les quatre thèmes de rang 70 à 100 ont été ajoutés le 19/08/2026, après la première campagne de
# catégorisation assistée : sur 988 scrutins, 251 étaient tombés dans `autre`, dont 63 relevant des
# institutions, 14 de l'agriculture, 11 de l'Europe et 7 du travail. methodology.md § 4 les
# annonçait nommément (« On ajoutera probablement au moins : institutions/démocratie, Europe,
# travail/entreprise, agriculture ») — la campagne n'a fait que confirmer le besoin en le chiffrant.
#
# RÉSERVE IMPORTANTE, à ne pas perdre de vue : trois de ces quatre axes ne se lisent PAS
# gauche-droite. L'Europe (intégration contre souveraineté) est la seconde dimension classique de
# l'espace politique, orthogonale à la première ; l'agriculture et les institutions ne s'alignent
# que faiblement. La convention de signe ci-dessus, qui rend le signe d'une saisie comparable à
# celui de l'estimation automatique, y perd donc son sens. On les ajoute quand même — la
# catégorisation décrit le réel, elle ne se plie pas à ce que la mesure sait vérifier — mais tout
# taux d'accord calculé sur ces thèmes est à écarter, pas à interpréter (voir scripts/README.md,
# étape 5).
#
# Cette réserve est devenue une colonne (`axe_gauche_droite`, phase 4.1, F1/F2) parce qu'elle
# commande maintenant du calcul et de l'affichage, pas seulement une lecture prudente d'un script :
# `false` ne dit pas qu'un thème est moins légitime, il dit que notre mesure automatique de
# contrôle ne sait pas l'arbitrer, et qu'il n'est donc ni filtré par le désaccord de mesure (F1) ni
# publié sur une page publique tant qu'aucune relecture humaine ne lui donne un fondement.
# `axe_gauche_droite` est un champ obligatoire : `seed_themes` refuse un fichier qui l'omet, pour
# forcer la question à chaque thème ajouté plus tard.

